<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explosion Lab</title>
<style>
  :root { color-scheme: dark; --bg: #0c0e10; --panel: #15181b; --line: #262b30; --text: #d7dbe0; --dim: #7d8791; --on: #e8a33c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 290px; height: 100%; }
  #stage { position: relative; min-width: 0; }
  #c { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #hud { position: absolute; left: 10px; top: 10px; padding: 8px 10px; background: rgba(0,0,0,.6); border-radius: 6px;
         font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; pointer-events: none; }
  aside { overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px 40px; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 16px 0 6px; font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 4px; }
  button { background: #1f2327; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3b434b; }
  button.on { border-color: var(--on); color: var(--on); }
  button.big { flex: 1; padding: 8px 4px; font-weight: 600; }
  select, input { background: #1f2327; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; font: inherit; }
  input[type=number] { width: 80px; }
  label { color: var(--dim); }
  .meta { color: var(--dim); font-size: 12px; margin: 2px 0 6px; }
  pre#out { white-space: pre-wrap; font: 11px/1.4 ui-monospace, Menlo, monospace; background: #0f1113; padding: 6px; border-radius: 4px; min-height: 2em; }
  kbd { font: 11px ui-monospace, Menlo, monospace; color: var(--dim); }
  @media (max-width: 720px) { #app { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three-r160/build/three.module.js",
  "three/addons/": "./vendor/three-r160/addons/"
} }
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- FLIR ironbow thermal: luminance (CSS grayscale weights) through a colour table -->
  <filter id="flir" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.020 0.114 0.290 0.541 0.761 0.910 0.973 0.988 0.992 1.000 1.000"/>
      <feFuncG type="table" tableValues="0.008 0.039 0.043 0.059 0.114 0.251 0.439 0.639 0.827 0.953 1.000"/>
      <feFuncB type="table" tableValues="0.102 0.369 0.541 0.604 0.494 0.290 0.118 0.063 0.227 0.604 1.000"/>
    </feComponentTransfer>
  </filter>
</svg>
<div id="app">
  <div id="stage"><canvas id="c"></canvas><div id="hud"></div></div>
  <aside id="panel"></aside>
</div>
<script type="module" src="./lab/main.js"></script>
</body>
</html>
